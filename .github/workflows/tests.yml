# Runs the test suite on every push and pull request, on several Python
# versions, so a broken change is caught straight away.
name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project and pytest
        run: pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -v
      - name: Smoke-test the installed command
        run: |
          gpa-analyzer summary data/sample_results.csv
